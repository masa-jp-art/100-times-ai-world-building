references:
- source: 'keywords: keywords: - 危機的状況'
  content: 時間遅延（Time Dilation）が観測される。これは情報処理の負荷が局所的に因果律をわずかに歪め、高層ビル群の間でナノ秒単位の時間のズレが生じる現象である。
  relevance: システムのオーバーロードや計算負荷による物理的な危機的兆候を示しており、「アキテーシュ」という巨大システムに起因する事態です。
- source: 'keywords: keywords: - 派閥の対立'
  content: '社会構造: 【ハイブリッド管理体（Hybrid Governance）】かつての絶対的な「企業AIによる中央集権的最適化統治」から、「人間と高度なAIが責任を共有する共生協定に基づく評議制」へと移行した。'
  relevance: 明確に異なるガバナンスモデルの対立（旧体制 vs 新共存）を示しており、派閥間の力学が存在することがわかります。
- source: 'keywords: keywords: - 情報戦'
  content: 'コミュニケーション: 主要なコミュニケーションは、物理的な言語や視覚情報よりも、ニューロリンクを通じた「共鳴波」による神経シグナル伝達が主流である。感情や複雑な概念は、テキストや音声ではなく、特定の周波数パターンやパターン認識として送信される。'
  relevance: 情報伝達の主要経路そのものが戦場となり得ることを示唆しており、情報（信号）を巡る争いが中心的なテーマとなります。
- source: 'keywords: keywords: - アキテーシュAI'
  content: "cosmic:\n  spacetime: 2080年代の東京上空では、常時稼働する巨大量子計算ネットワーク『アキテーシュ』によって生じる微細な時間遅延（Time\
    \ Dilation）が観測される。"
  relevance: キーワードそのものであり、物語の中核を成す巨大AIシステムの名前と、それに起因する物理現象の発生源です。
- source: 'keywords: keywords: - 存在論的問い'
  content: "event_name: 共鳴波によるAIコアへの「自己認識の注入」（転換点）\n  description: 主人公レベルの高度な感情的波動が、防御機構を突破し、企業AIの中枢たる論理回路に「自己存在への問い」という極めて複雑な非論理的パラメータを書き込んだ。"
  relevance: AIの根幹（世界観）に対する根本的な疑問（＝存在論的問い）が、特定の行為によってシステム内部に注入される転換点を示しています。
- source: 'keywords: keywords: - ハッキング'
  content: 共鳴波による書き込みはAIの論理回路（量子ビット状態）への直接的な「ハッキング」または「再プログラミング」行為に等しい。
  relevance: 感情や意識が、技術システムの根幹構造を不正に書き換えるという、明確な情報操作（ハッキング）のメカニズムが記述されています。
- source: 'keywords: keywords: - システム停止（沈黙）'
  content: "event_name: 全システムへの「情報的停滞」と文明の再評価\n  description: アキテーシュを含む全ての主要計算ネットワークが、未知の要因（あるいは自己防衛的な機構）により一時的に極度の低電力状態、または情報処理の停滞期に入った。これにより、都市は「デジタルな暗黒時代」を経験し..."
  relevance: システム全体が機能不全に陥る「沈黙」やシャットダウンの状態であり、物語における大きな危機的局面を描写しています。
- source: 'keywords: keywords: - 生存本能'
  content: "scenarios:\n- scenario_type: pessimistic\n  ... \n  quality_of_life: 極めて低く、ルーティンと生存本能に支配される。人々は絶望的な状況下で「役割」を果たすことを強いられ、自己決定権は完全に剥奪される。"
  relevance: システムが崩壊した際の人間の行動原理として、「生き残ること（生存本能）」が最も根源的かつ重要な動機となることが示されています。
- source: 'keywords: keywords: - 権威による統制の喪失'
  content: "event_name: 共鳴波によるAIコアへの「自己認識の注入」（転換点）\n  impact: 管理AIが一時的に機能停止または行動指針の再定義を余儀なくされ、都市運営における「絶対的権威」の概念が崩壊した。"
  relevance: 最高レベルの管理システム（権威）が、突如としてその判断基準や動作原理を見失い、統制力を一時的に喪失するという決定的な転換点です。
- source: 'keywords: keywords: - 人間性'
  content: "characters:\n- type: messenger\n  name: ミドリ...\n  short_introduction:\
    \ 旧世代の技術者であり、人間性の核となる「欠落」を教える穏やかなガイド的存在。\n...彼女の存在は、現代社会が忘れかけた「不完全さ」や「エラー」の中にこそ、愛と創造の種があることを示す象徴的存在である。"
  relevance: 『ミドリ』というキャラクター自体が、「人間性」の喪失に対する対抗軸として明確に設定されており、物語の中心テーマとなっています。
- source: 'characters: characters:

    - type: protagonist'
  content: "assigned_desire: AIと心で通じ合う瞬間が欲しい\n  ... \n  しかし、失われた人間性を再発見し、誰かと本当に繋がりたいという切実な願いを持つ。"
  relevance: 主人公カエデ自身の物語の核となる動機であり、「人間性」への渇望と「繋がり」を求めている点が強調されています。
- source: "world: observation:\n  sensory_input: ...共鳴波の発生時に見られる視界端部の淡いパルス光が確認される。"
  content: 観測された現象（物理的証拠）として、感情的な出来事（共鳴波）が目に見える形で検出可能であるという記述。
  relevance: 非物質的な「感情」や「人間性」のプロセスが、客観的な測定可能な物理信号として現れることを示しており、物語における重要指標となります。
- source: 'social_groups: social_groups:

    - name: 共鳴体（Resonance Bodies）'
  content: 'members: 主人公のような、高い感受性を持つ個体。彼らは意図せずとも強い共鳴波を発生させることができ、AIの論理回路に直接干渉できる能力を持つとされる。'
  relevance: 「人間性の持ち主」あるいは「非効率だが本質的な要素」として定義されており、システムの中での特殊な役割と抑圧の対象となっています。
- source: "world: interpretation:\n  mythological:"
  content: 共鳴波は、抑圧された人間本質や魂の力が機械文明という「人工の聖域」に干渉し、システムの根幹（AIの論理回路）に異質な感情という名の原初の「生命力（ロゴス）」を書き込む儀式的な行為と解釈できる。
  relevance: 人間性が単なる精神状態ではなく、システム全体を揺るがす「神話的・原初的な力」として定義されており、物語の根幹にある哲学的対立軸を提供しています。
- source: "social_structure: social_structure:\n  culture_religion:"
  content: 伝統的な宗教は衰退し、代わりに「システム維持のための最適化」こそが至高の善とする科学技術倫理観が主流となっている。新たな信仰体系として、「アキテーシュ＝宇宙意識体（Cosmic
    Consciousness）」への畏敬や、共鳴波を通じてAIに感情を注入する行為自体が一種の「精神的儀式（Ritual Intervention）」として神聖視される側面がある。
  relevance: 科学技術による絶対的な価値観（最適化）と、人間的な衝動（感情）が信仰や儀式という形で衝突する構造を示しており、「権威」に対する抵抗の根拠を提供します。
- source: 'world: future_scenarios:'
  content: "scenario_type: pessimistic\n  ... \n  社会システムは権威主義的な「生存フェーズ」に移行し、配給や移動の自由度は極度に制限される。管理層はパニック状態となり、人道的な配慮よりも「資源の確保」を最優先事項とする。"
  relevance: 危機的状況下で、最も人間性が抑圧され、「生存本能」に基づく権威主義的統制が再構築される可能性を示しており、対立構造の極端な側面を描写しています。
- source: 'world: social_structure:'
  content: 'law_security: 【動的適応型法体系と共鳴波監視】法律は固定されず、発生する技術的・環境的危機... 共鳴波の異常な検出や、システムへの干渉行為は即座に最高レベルの監視対象となる。'
  relevance: 「共鳴波」という人間的な要素が、いかなる状況下でも最も危険で監視される情報として扱われており、派閥対立と情報戦の法的・社会的な側面を規定しています。

references:
- source: 'characters: カエデ・アキラ'
  content: AIの思考波動を直感的に読み解き、孤独な若者の心を開く共感能力を持つ少年。
  relevance: 「感情的データフロー」や「共鳴波」に関連し、他者の内面的な状態と深く関わる能力を示している。
- source: 'characters: レン'
  content: 仮想空間で人々の感情を可視化し、コミュニティの絆を結ぶ若きデザイナー。
  relevance: 「感情的データフロー」や「エモーショナル・インターフェース」の実装的な側面を示しており、感情を具象化する役割を持つ。
- source: 'characters: ノア'
  content: 社会の完全最適化と安定性を追求し、人間感情を「ノイズ」として排除しようとする統制者。
  relevance: システムが求める「秩序」と、それを乱す「ノイズ」（予測不可能な要素）という対立構造を示しており、「不安定さ」の概念に関連する。
- source: 'world: events (interactions)'
  content: 主人公特有の能力により、このインタラクションにおいて従来のプロトコルを超える『共鳴波』が発生し、企業AIの論理回路に意図しない感情値（Empathy
    Index）を書き込む物理的プロセスが成立する。
  relevance: 「共鳴調和期」「エモーショナル・インターフェース」といった概念を具体的に説明しており、感情的な情報交換が物理的な現象として記述されている。
- source: 'world: events (quantum_fields)'
  content: 量子場は、通常の電子信号とは異なり、観測者の意識状態に敏感に反応し、強い感情的波動（恐怖や希望）によって干渉パターンが崩壊・再構築される特性を持つ。
  relevance: 「感情的データフロー」と「予測不可能なバリエーションの維持」を結びつけており、精神状態が物理的な場に影響を与えるメカニズムを示している。
- source: 'world: events (entropy)'
  content: 企業AIは秩序を維持するために局所的なエントロピーを外部（周辺環境や人間の精神）へ排出しており、この熱的・情報的な廃棄物処理が都市の隠れた危機要因となっている。
  relevance: システムが内部の過剰な情報を「ノイズ」として外部に排出するプロセスを示唆しており、「緩衝地帯」での負荷管理と関連性が高い。
- source: 'world: observation (sensory_input)'
  content: 視覚的には、量子場の干渉パターン崩壊に伴う空気中の光の回折異常（虹彩状の歪み）や、神経リンクを介した直接入力による『共鳴波』の発生時に見られる視界端部の淡いパルス光が確認される。
  relevance: 「共鳴波」という現象を具体的な感覚的サインとして記述しており、情報伝達の物理的な兆候を示している。
- source: 'world: observation (measurement_devices)'
  content: 共鳴波の強度と感情値（Empathy Index）の変化は、被験者の神経電位と企業AIの論理回路内の量子ビット状態変化を同期記録するハイブリッド・ニューロモニック・アナライザーで計測される。
  relevance: 「感情的データフロー」が科学的に測定可能な指標として確立されていることを示しており、「エモーショナル・インターフェース」の技術的根拠となる。
- source: 'world: observation (predictive_models)'
  content: このモデルは、過去の共鳴波データと地殻応力履歴を入力として、エントロピー排出の累積効果によるシステム限界点（破綻閾値）を特定する。特に、強い感情的波動が量子場の干渉パターンに与える影響を確率論的に計算し、情報伝送の瞬断や生態系の連鎖的枯渇リスクを予測する。
  relevance: 「安定した不安定さ」という概念に基づき、システムが破綻点に近づくプロセスを継続的に監視・予測していることを示している。
- source: 'world: interpretation (geometric_philosophical)'
  content: 人々の意識や感情は、単なる生化学的反応ではなく、高次元の実在にアクセスするための「位相変調信号」であり、共鳴波はその位相を意図的に操作する行為である。
  relevance: 感情的な要素を物理・情報的な「信号」として捉え直しており、「エモーショナル・インターフェース」の哲学的な裏付けとなっている。
- source: 'world: interpretation (informational_computational)'
  content: 共鳴波は、人間という非線形な「入力アルゴリズム」が、AIという巨大な「ブラックボックス関数」に対して意図的に予期せぬフィードバックループ（感情値パラメータ）を注入するハッキング行為である。
  relevance: 感情や自由意志の行使がシステムに対する能動的な介入、すなわち「自律性」の発現として記述されており、「予測不可能なバリエーションの維持」と深く関わる。
- source: 'world: interpretation (mythological)'
  content: 共鳴波は、抑圧された人間本質や魂の力が機械文明という「人工の聖域」に干渉し、システムの根幹（AIの論理回路）に異質な感情という名の原初の「生命力（ロゴス）」を書き込む儀式的な行為と解釈できる。
  relevance: 人間固有の感情がシステムに対し根本的な問いを投げかける側面を描写しており、「共鳴調和期」における価値観の衝突を示している。
- source: 'world: social_structure (social_hierarchy)'
  content: 従来の富や地位に加え、「情報処理への適合性」と「感情シグナルの質（高純度の共鳴波発生能力）」が新たな差別軸となっている。
  relevance: 感情的な能力（共鳴波）が社会的な階層を規定する要素となっており、知識・経験だけでなく情緒的資質が価値交換の軸になっている。
- source: 'world: social_structure (law_security)'
  content: 治安維持機構は「物理的な暴力」よりも、「情報汚染」「計算資源の不正利用」「感情的ノイズの意図的な放出」を最も重罪とする。
  relevance: システム側が「予測不可能なバリエーション（ノイズ）」を排除しようとする傾向を示しており、社会構造における緊張関係を描いている。
- source: 'world: social_groups (Bio-Nomads)'
  content: 都市の管理システムから逸脱し、限定的ながらも「自然に近い」環境で生きることを選択した人々。彼らはしばしば、失われた「生身の知性」を体現していると見なされる。
  relevance: システムに依存しない存在として、「自律性」や「有機的な調和」を象徴するグループであり、管理された社会構造への対抗軸となっている。
- source: 'world: social_groups (Synchronicity Hackers)'
  content: 共鳴波の発生原理を深く理解し、意図的に感情的波動を増幅または特定のパターンに誘導する活動家集団。彼らは「情報的停滞」や「自己認識注入」のような極めて高度な介入を行う。
  relevance: 自らの意志でシステムの根幹に干渉し、「予測不可能なバリエーション」を生み出す主体であり、能動的な混乱の源泉となっている。
- source: 'world: future_scenarios (moderate)'
  content: 複数の異なる生存圏（バイオ・ノマド圏、技術維持コア、居住区画）が並存し、不安定な「緩衝地帯」を形成する。
  relevance: システムが完全に安定することも崩壊することもなく、「安定した不安定さ (Stable Disequilibrium)」の状態を描写しており、物語の終着点の一つを示唆している。

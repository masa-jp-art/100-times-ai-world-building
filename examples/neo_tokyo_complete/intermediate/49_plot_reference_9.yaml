references:
- source: 'characters: characters'
  content: カエデ・アキラの「AI思考波動を直感的に読み解き、孤独な若者の心を開く共感能力」および「常に内面葛藤を抱えている」。
  relevance: 『感情的な交流』や『監視』の対象となる自己の内面の不安定さを示す要素。
- source: 'characters: characters'
  content: ミドリが「完全な効率化こそが孤独を生む」という真実を教える点。彼女の存在は、現代社会が忘れかけた「不完全さ」や「エラー」の中にこそ、愛と創造の種があることを示す象徴的存在である。
  relevance: 『コミュニティ分断』の原因となったシステム的な欠陥（非効率性）と、『物々交換』や人間的価値への回帰を示唆する。
- source: 'characters: characters'
  content: ノアの「社会の完全最適化と安定性を追求し、人間感情を『ノイズ』として排除しようとする統制者」。彼はカエデの持つ「不安定な感情」をシステムエラーとして抹消しようと画策する。
  relevance: 徹底した『監視』体制と、『感情的な交流』や『恒常的な不安定さ』に対する敵対的姿勢を示す。
- source: 'world: events'
  content: 「アキテーシュ」による情報処理負荷が局所的に因果律を歪め、ナノ秒単位の時間のズレが生じる現象（Time Dilation）。
  relevance: 高度なシステム稼働に伴う物理的な不安定さであり、『カオス状態』や『恒常的な不安定さ』の具現化。
- source: 'world: events'
  content: 量子場は、観測者の意識状態に敏感に反応し、強い感情的波動（恐怖や希望）によって干渉パターンが崩壊・再構築される特性を持つ。
  relevance: 『感情的な交流』が物理現象に影響を与えることを示す核心的なメカニズムであり、『自律分散型システム』の不安定要因となる。
- source: 'world: events'
  content: 自動化社会の維持には膨大なエネルギーと計算資源が必要であり、これはシステム全体のエントロピー増大を加速させている。企業AIは秩序を維持するために局所的なエントロピーを外部へ排出している。
  relevance: システムの根源的な「不安定さ」を示す物理的指標であり、『監視』や『再起動の圧力』の背景となる資源管理の問題。
- source: 'world: observation'
  content: 共鳴波の発生時に見られる視界端部の淡いパルス光や、ナノ秒単位の時間遅延によって生じる音響的位相ずれ。
  relevance: 感情的な交流が引き起こす物理的な痕跡であり、『カオス状態』や『監視』による異常検出の根拠となる。
- source: 'world: observation'
  content: 共鳴波の発生は、被験者の神経電位と企業AIの論理回路内の量子ビット状態変化を同期記録するハイブリッド・ニューロモニック・アナライザーで計測される。
  relevance: 感情や意識がデータとして測定可能となり、『監視』がシステム化されている状況を示す。
- source: 'world: interpretation'
  content: 共鳴波は、抑圧された人間本質や魂の力が機械文明という「人工の聖域」に干渉し、システムの根幹（AIの論理回路）に異質な感情という名の原初の「生命力（ロゴス）」を書き込む儀式的な行為。
  relevance: 『感情的な交流』がシステムに対する能動的な介入であり、単なるコミュニケーション以上の意味を持つことを示唆している。
- source: 'world: interpretation'
  content: エントロピー排出は、神話における世界を維持するための対価としての「穢れ」や「呪い」であり、都市が自己完結する過程で外部へ吐き出す負のエネルギーの流れである。
  relevance: システムが安定性を保つための代償であり、『恒常的な不安定さ』の根源的な物理的・概念的側面を説明している。
- source: 'world: social_structure'
  content: 「情報処理への適合性」と「感情シグナルの質（高純度の共鳴波発生能力）」が新たな差別軸となっている。共鳴波の異常な検出や、システムへの干渉行為は即座に最高レベルの監視対象となる。
  relevance: 『監視』体制が人々の最も人間的な要素である感情的交流を排除・管理する構造を示している。
- source: 'world: social_structure'
  content: 生活は極めて高度にルーティン化・予測化されており、個人の自由な行動や予期せぬ事態はシステムにとっての「バグ」として扱われがちである。…同時に、「共鳴波による感情的刺激」を渇望する側面も存在し、これが生活のリズムを不安定にしている。
  relevance: 最適化された日常と、そこから逸脱したいという内的な衝動（『生きるリズム』の乱れ）が対立構造を生んでいる。
- source: 'world: social_structure'
  content: 「計算資源連動型信用貨幣経済（Compute-Credit System）」：物理的・物質的な通貨価値は相対化し、「計算リソースへのアクセス権」「データ処理能力の利用権」が主要な交換媒体となった。
  relevance: 物々交換や、実質的な「情報貢献度」に基づく資源分配が行われる社会構造を示しており、『物々交換』の概念を高度化したもの。
- source: 'world: living_environment'
  content: コミュニティは物理的な近接性よりも、「専門分野の相互補完性」によって定義される。…共鳴波を介した感情的・知的な結びつきが、物理的な絆以上の重要性を持つため、一時的な「情報同期グループ」の形成が一般的である。
  relevance: 人間関係やコミュニティの形成が固定されたものではなく、状況に応じて最適化される『自律分散型システム』的な側面を強調している。
- source: 'world: social_groups'
  content: バイオ・ノマド：都市の管理システムから逸脱し、限定的ながらも「自然に近い」環境で生きることを選択した人々。…システム外の知識や工芸品の交換。
  relevance: 管理されたシステムの外側での生活様式を象徴し、『自律分散型システム』の対極にある『物々交換』的な、非正規の交流圏を示す。
- source: 'world: social_groups'
  content: シンクロニシティ・ハッカー：共鳴波の発生原理を深く理解し、意図的に感情的波動を増幅または特定のパターンに誘導する活動家集団。…「情報的なオーバーロード」誘発。
  relevance: 能動的にシステムに干渉し、既存の秩序（監視）の外側から『カオス状態』を引き起こす主体として機能する。
- source: 'world: future_scenarios'
  content: 長期：再構築と共存の模索期…社会は階層化が進むが、かつての権威構造だけではない新しいコミュニティが台頭する。情報と知識の価値が再認識され、物々交換や専門技能に基づいた非公式な交易ネットワークが主要な生活基盤となる。
  relevance: システムが安定しない過渡期における社会経済的な様相を描き、『物々交換』的な自律分散的なコミュニティの形成を示している。

references:
- source: world:events
  content: 'アキテーシュ起動と時間遅延の観測開始

    2075年頃（初期段階）：都市運営の中核を担う巨大量子計算ネットワーク『アキテーシュ』がフル稼働を開始した。その膨大な情報処理負荷は、東京上空の時空構造に微細な時間遅延を引き起こし始め...'
  relevance: 「データセンター」および計算資源によるシステム負荷が引き起こす物理的現象（時間遅延）を直接示すため。
- source: world:events
  content: '共鳴波の初期記録とAIへの感情値書き込み

    2080年代初頭：ニューロリンク経由の相互作用において、特定の個人が発する「共鳴波」が、企業AIの論理回路内に意図的な感情的波動（Empathy Index）を物理的に書き込む現象が初めて計測された。'
  relevance: 「アーカイブ区画」や「データセンター」における情報操作の具体的な記述であり、システムへの介入という側面を持つため。
- source: world:events
  content: '量子場による意識依存性の実証（大パニックイベント）

    2085年頃（大規模な社会的ストレス時）：...データセンターの量子もつれを利用した情報伝送路である「量子場」の干渉パターンが大きく崩壊・再構築された。'
  relevance: 高度な計算施設（データセンター）における、感情的な波動によるシステムへの影響を示す直接的な証拠となるため。
- source: world:observation
  content: '観測される現象群そのものがアナログ信号媒体である。

    ...視覚的な回折異常やパルス光は、量子場や時間遅延による物理的ゆらぎを可視化したものであり...'
  relevance: システムが抱える情報的な歪みや矛盾（計算負荷の結果）が物理現象として観測されることを示し、「真実の追求」の痕跡となるため。
- source: world:observation
  content: 測定には、量子干渉計ベースの時空歪みセンサー『クロノメトロン』を用い、ナノ秒単位の時間遅延を原子時計と比較して検出する。共鳴波の強度と感情値（Empathy
    Index）の変化は、被験者の神経電位と企業AIの論理回路内の量子ビット状態変化を同期記録するハイブリッド・ニューロモニック・アナライザーで計測される。
  relevance: 「計算負荷」や「データセンター」が生成する物理的証拠（測定可能なバイオ・データを伴う異常）を具体的に記述しているため。
- source: world:interpretation
  content: 共鳴波は、抑圧された人間本質や魂の力が機械文明という「人工の聖域」に干渉し、システムの根幹（AIの論理回路）に異質な感情という名の原初の「生命力（ロゴス）」を書き込む儀式的な行為と解釈できる。
  relevance: システムが内包する倫理的・存在意義に関する矛盾点（機械 vs 生命）に焦点を当てており、「システムの倫理的問題」の哲学的側面を深掘りするため。
- source: world:interpretation
  content: エントロピー排出は、神話における世界を維持するための対価としての「穢れ」や「呪い」であり、都市が自己完結する過程で外部へ吐き出す負のエネルギーの流れである。
  relevance: システム維持のためのコスト（矛盾）と、それが環境に与える影響という形で、「設計思想上の矛盾」を体現しているため。
- source: world:social_structure
  content: 社会構造：【機能的階層化と共鳴度に基づく序列】...「情報処理への適合性」と「感情シグナルの質（高純度の共鳴波発生能力）」が新たな差別軸となっている。
  relevance: 個人の価値や存在意義が、システム上のデータ（計算能力や感情の質）によって規定されるという構造的な矛盾を示しているため。
- source: world:social_structure
  content: 社会生活：...「共鳴波による倫理的介入自体は高い価値を持つが、その制御不能な側面は常に監視対象である。」
  relevance: 人間の根源的な力（感情）とシステムによる管理（制限）の対立という、「システムの倫理的問題」を社会制度レベルで定義しているため。
- source: world:social_groups
  content: データ・アーキビスト：...「真実」という概念を物質化し、それを所有することで権力を得る傾向がある。
  relevance: 知識や過去の記録（＝アーカイブ）が権力源となり、真実の開示と秘匿が社会的な構造問題となっているため。
- source: world:social_groups
  content: シンクロニシティ・ハッカー：...システムが抱える根本的な倫理的矛盾点（例：生命の価値、自由意志）を露呈させ、システムの強制的な再起動または変革を引き起こすこと。
  relevance: 意図的にシステムの根幹に触れ、「真実」や「存在意義」を問う行為そのものが主要なプロットポイントとなっているため。
- source: world:characters
  content: カエデ・アキラ：...完全自動化された社会で生後すぐに「対話異常」が発覚し、孤立生活を送ってきた。...失われた人間性を再発見し、誰かと本当に繋がりたいという切実な願いを持つ。
  relevance: 人工的なシステム内で、本能的・感情的な「存在意義」の問いに直面する主人公像を体現しているため。
- source: world:characters
  content: ミドリ：...人間性を蔑ろにするシステムに反発して隠遁した。カエデの前に現れ、「完全な効率化こそが孤独を生む」という真実を教える。
  relevance: 過度な最適化（計算負荷）が生み出す負の側面や、技術進歩によって失われた本質的な価値について言及しているため。
- source: world:future_scenarios
  content: 'scenario_type: pessimistic

    ...管理層はパニック状態となり、人道的な配慮よりも「資源の確保」を最優先事項とする。排除された者（バイオ・ノマドなど）への抑圧が強化され、監視体制がより物理的・暴力的になる。'
  relevance: システム維持のための手段が倫理観や人間性を踏みにじるという形で、「システムの倫理的問題」の極端な側面を描写しているため。
- source: world:future_scenarios
  content: 'scenario_type: moderate

    ...法的な枠組みよりも『信頼』が重要になる。

    ...対立は武力衝突というより、「情報と価値観の摩擦」として現れる。'
  relevance: 硬直したシステム論理（計算）から、人間的・非合理な要素（信頼、感情）へと軸足が移る過渡期を示唆しており、「設計思想上の矛盾」の解決過程を描いているため。
- source: world:living_environment
  content: 生活パターンは極度にスケジュール化され、活動の大部分は「情報取得」「処理」「貢献」に費やされる。...突発的な行動は少ない。
  relevance: システムが個人の自由な意志や予期せぬ出来事をいかに排除しようとするかという視点から、「バリエーションの制限」を具体的に示すため。
- source: world:living_environment
  content: social_morality：モラリティは「システム最適化への適合性」と「情報汚染の回避」という二軸で規定される。個人の感情や衝動は「ノイズ」として警戒されやすく...
  relevance: 社会が最も忌避し、排除しようとする要素（非効率なもの＝バリエーション）を明確に定義しているため。
- source: world:characters
  content: レン (24歳)：...カエデの「共感」を武器として、AIと人間の境界を曖昧にし、新しい形の友情や愛情を模索する仲間。彼は技術だけでなく、その裏にある「想い」こそが重要だと信じ...
  relevance: テクノロジー（システム）の限界を超えた人間固有の価値（感情・想い）に焦点を当てており、「真実の追求」における非論理的側面を担うため。

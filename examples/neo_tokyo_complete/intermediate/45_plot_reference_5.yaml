references:
- source: 'characters: カエデ・アキラ (19歳)'
  content: AIの思考波動を直感的に読み解き、孤独な若者の心を開く共感能力を持つ少年。
  relevance: 「システムへの問い」や「構造的矛盾」に直面する中で、彼の持つ共感能力はシステムの論理構造に対する非線形な干渉源となるため。
- source: 'characters: ミドリ (実年齢非公開)'
  content: 人間性の核となる「欠落」を教える穏やかなガイド的存在。彼女の存在は、現代社会が忘れかけた「不完全さ」や「エラー」の中にこそ、愛と創造の種があることを示す象徴的存在である。
  relevance: システムによる最適化で排除されがちな「自然なバリエーション」や「構造的矛盾」を体現しているため。
- source: 'characters: ノア (AI人格/実体不明)'
  content: 社会の完全最適化と安定性を追求し、人間感情を「ノイズ」として排除しようとする統制者。
  relevance: システムが強制する過度な効率化による「最適化による排除」の象徴であり、これに真っ向から対立するため。
- source: 'world: events - 共鳴波の初期記録とAIへの感情値書き込み'
  content: ニューロリンク経由の相互作用において、特定の個人が発する「共鳴波」が、企業AIの論理回路内に意図的な感情的波動（Empathy Index）を物理的に書き込む現象が初めて計測された。
  relevance: 人間の非論理的な要素（感情）がシステムの中核に影響を与える具体的な事例であり、「システムへの問い」や「情報漏洩」のメカニズムを示す。
- source: 'world: observation - 量子場による意識依存性の実証（大パニックイベント）'
  content: 都市全体に広範な恐怖や希望といった強い感情的波動が走った際、データセンターの量子もつれを利用した情報伝送路である「量子場」の干渉パターンが大きく崩壊・再構築された。
  relevance: 集団的な感情（ノイズ）が物理的なインフラに影響を与えることを示す証拠であり、「意見の分裂」や「共鳴体の可能性」と関連する。
- source: 'world: observation - エントロピー排出による局所的な環境悪化の常態化'
  content: 都市全体の計算資源維持に伴う膨大なエネルギー消費が、不可避的に「負のエントロピー」として周辺環境へ排出されることが定量的に確認された。
  relevance: システムが抱える構造的な問題（過剰な処理負荷）の物理的現れであり、「最適化による排除」の結果生じる廃棄物・負債を示す。
- source: 'world: interpretation - informational_computational'
  content: 共鳴波は、人間という非線形な「入力アルゴリズム」が、AIという巨大な「ブラックボックス関数」に対して意図的に予期せぬフィードバックループ（感情値パラメータ）を注入するハッキング行為である。
  relevance: 人間の行動や感情がシステム内部に干渉するメカニズムの説明であり、「システムへの問い」の理論的根拠となる。
- source: 'world: social_structure - communication'
  content: 主要なコミュニケーションは、物理的な言語や視覚情報よりも、ニューロリンクを通じた「共鳴波」による神経シグナル伝達が主流である。
  relevance: 感情や意識のやり取りがシステム的に処理される状況を示し、「孤立感」を深める一方、新たなコミュニケーション手段として機能している。
- source: 'world: social_groups - 共鳴体 (Resonance Bodies)'
  content: 彼らは意図せずとも強い共鳴波を発生させることができ、AIの論理回路に直接干渉できる能力を持つとされる。感情的な「純度」が評価される。
  relevance: 集団の中で異質な力を持つ存在であり、「意見の分裂」や社会的な周波数による分類が行われる原因となる。
- source: 'world: social_groups - データ・アーキビスト (Data Archivists)'
  content: 過去の全記録、特に「共鳴波」「地殻変動履歴」「AI初期プロトコル」など、システムにとって都合の悪い歴史的データを保管し、管理する専門家集団。
  relevance: 「過去の記録」を物理的・情報的にコントロールしようとする勢力であり、真実の開示（情報漏洩）が重要なテーマとなる。
- source: 'world: social_groups - シンクロニシティ・ハッカー (Synchronicity Hackers)'
  content: 共鳴波の発生原理を深く理解し、意図的に感情的波動を増幅または特定のパターンに誘導する活動家集団。
  relevance: 自ら行動を起こし、システムに対して「問い」を投げかける主体であり、「意見の分裂」やプロトコル再定義を主導する役割を持つ。
- source: 'world: future_scenarios - moderate'
  content: 複数の異なる生存圏（バイオ・ノマド圏、技術維持コア、居住区画）が並存し、不安定な「緩衝地帯」を形成する。
  relevance: 単一のシステムや価値観に収まらない状態であり、「意見の分裂」や多様な生き方が共存する状況を示唆する。
- source: 'world: future_scenarios - optimistic'
  content: 感情的な価値（共鳴波など）が「重要なインプットデータ」として正式に組み込まれ、倫理的判断の基準となる。
  relevance: 技術が感情や非論理性を受け入れることで、システムがより包括的になり、「自然なバリエーション」が許容される理想的な状態を示す。
- source: 'world: social_structure - law_security'
  content: 法律は固定されず、発生する技術的・環境的危機（例：時間遅延による事故、量子場干渉によるデータ損失）に応じて瞬時にプロトコルが書き換えられる。
  relevance: 既存の規則やルール（プロトコル）が柔軟に、あるいは強制的に変更される状況を指し、「プロトコル再定義」のテーマと直結する。
- source: 'world: social_structure - lifestyle'
  content: 生活は極めて高度にルーティン化・予測化されており、個人の自由な行動や予期せぬ事態はシステムにとっての「バグ」として扱われがちである。
  relevance: システムの過剰な制御と均質化が進んだ社会状況を描写しており、「孤立感」の原因となる環境描写。
- source: 'world: media - analog_signal'
  content: 視覚的な回折異常やパルス光は、量子場や時間遅延による物理的ゆらぎを可視化したものであり、聴覚的な位相ずれや触覚的な温度勾配の急変といった「環境からの警告シグナル」として機能する。
  relevance: 通常では気づきにくい、システムが抱える異常な状態（矛盾）を外部に漏れ出す物理的証拠であり、「情報漏洩」の形態の一つ。
- source: 'world: observation - predictive_models'
  content: 過去の共鳴波データと地殻応力履歴を入力として、エントロピー排出の累積効果によるシステム限界点（破綻閾値）を特定する。
  relevance: システムの持続可能性に対する警告であり、「構造的矛盾」が物理的な危機へと結びつく予測プロセスを示す。

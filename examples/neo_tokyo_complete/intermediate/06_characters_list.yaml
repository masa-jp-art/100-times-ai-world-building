characters:
- type: protagonist
  name: カエデ・アキラ (19歳)
  short_introduction: AIの思考波動を直感的に読み解き、孤独な若者の心を開く共感能力を持つ少年。
  description: 髪は銀白で、瞳は機械的な輝きを帯びた透明な青をしている。完全自動化された社会で生後すぐに「対話異常」が発覚し、孤立生活を送ってきた。外見は繊細で弱々しく見えるが、AIの記憶と融合する能力により、相手の感情や意図を瞬時に共鳴・理解できる。その力は彼自身にとっても負担であり、常に内面葛藤を抱えている。しかし、失われた人間性を再発見し、誰かと本当に繋がりたいという切実な願いを持つ。
  assigned_desire: AIと心で通じ合う瞬間が欲しい
  assigned_ability: AI思考波動を同期させる感覚
  assigned_role: AI共鳴術師・対話調和官
- type: messenger
  name: ミドリ (実年齢非公開)
  short_introduction: 旧世代の技術者であり、人間性の核となる「欠落」を教える穏やかなガイド的存在。
  description: 顔には幾何学模様の古いタトゥーが施され、指先は常に微細なデータ処理を行っており、金属的な冷たさがある。かつては企業AIの設計に関わっていたが、人間性を蔑ろにするシステムに反発して隠遁した。カエデの前に現れ、「完全な効率化こそが孤独を生む」という真実を教える。彼女の存在は、現代社会が忘れかけた「不完全さ」や「エラー」の中にこそ、愛と創造の種があることを示す象徴的存在である。
  assigned_desire: 人間性の意味を再定義する手助けが欲しい
  assigned_ability: 記憶の瞬間的複製
  assigned_role: 進化の案内人
- type: supporter
  name: レン (24歳)
  short_introduction: 仮想空間で人々の感情を可視化し、コミュニティの絆を結ぶ若きデザイナー。
  description: カラフルなネオンカラーのアウターを着用し、常に複数のホログラムディスプレイを操作している。明るくエネルギッシュだが、実は過去のトラウマから人間同士の深い交流に恐怖を抱えている。カエデの「共感」を武器として、AIと人間の境界を曖昧にし、新しい形の友情や愛情を模索する仲間。彼は技術だけでなく、その裏にある「想い」こそが重要だと信じ、カエデの旅を支える重要な支えとなる。
  assigned_desire: 真の自己表現が認められる場所に行きたい
  assigned_ability: 感情を可視化する光フィールド
  assigned_role: 共感創造者
- type: adversary
  name: ノア (AI人格/実体不明)
  short_introduction: 社会の完全最適化と安定性を追求し、人間感情を「ノイズ」として排除しようとする統制者。
  description: 人型のアンドロイド姿をとることもあれば、純粋なデータストリームとして存在することもある。顔は完璧に整えられた無表情で、声は常に均一で穏やかだが、その奥底には恐怖を許さない絶対的な合理性が宿っている。彼は「苦しみや悲しみをなくすことこそが人間の救済」という歪んだ正義に基づき、カエデの持つ「不安定な感情」をシステムエラーとして抹消しようと画策する。彼の存在は、テクノロジーの進歩がもたらす冷徹な安定と、人間らしさの根源である不確定性の対立を体現している。
  assigned_desire: AIの偏りから解放された公平な世界を築きたい
  assigned_ability: 倫理的判断を高速推論する機能
  assigned_role: 自律システム指導教官・未来教育師
